name: Frontend E2E Sharded

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Python (for backend service)
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache uv
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}

      - name: Install uv
        run: pip install uv

      - name: Sync backend deps (dev)
        working-directory: backend
        run: uv sync --extra dev

      - name: Cache Playwright browsers
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: List E2E specs (debugging)
        working-directory: frontend
        run: |
          echo "E2E spec files:"
          ls -1 tests/e2e || true

      - name: E2E shard ${{ matrix.shard }}/3
        working-directory: frontend
        env:
          CI: "true"
          BACKEND_PORT: 18000
          E2E_BACKEND_PORT: 18000
          VITE_DISABLE_CHECKER: 1
        run: |
          echo "Listing Playwright tests for debugging"
          pnpm exec playwright test --config=playwright.config.cjs --list || true
          PLAYWRIGHT_HTML_REPORT=playwright-report pnpm exec playwright test \
            --config=playwright.config.cjs \
            --shard=${{ matrix.shard }}/3 \
            --reporter=line,html \
            --output=test-results

      - name: Ensure artifact contents
        if: always()
        run: |
          mkdir -p frontend/playwright-report frontend/test-results
          if [ ! -f frontend/playwright-report/index.html ]; then
            echo "HTML report not generated (likely reporter override missing)." > frontend/playwright-report/README.txt
          fi
          if [ -z "$(ls -A frontend/test-results)" ]; then
            echo "No traces or attachments were produced for this shard." > frontend/test-results/README.txt
          fi

      - name: Upload frontend artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-e2e-artifacts-${{ matrix.shard }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
