name: Backend Pipeline

on:
  workflow_call:
    outputs:
      coverage:
        description: Backend coverage percentage
        value: ${{ jobs.backend.outputs.coverage }}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.coverage }}
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v4

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache uv
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}

      - name: Install uv
        run: pip install uv

      - name: Sync deps
        working-directory: backend
        run: uv sync --extra dev

      - name: Lint backend
        working-directory: backend
        run: |
          uvx ruff check .
          uv run mypy .
          uv run bandit -q -r tasktree
          uv run yamllint -c ../.yamllint.yml .
          uv run djlint --extension j2 tasktree/config/prompts --check

      - name: Test backend with coverage
        id: tests
        working-directory: backend
        run: |
          uv run pytest --cov=tasktree --cov-report=xml --cov-report=html --cov-report=term

      - name: Capture coverage percent
        id: coverage
        working-directory: backend
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          tree = ET.parse("coverage.xml")
          root = tree.getroot()
          pct = root.attrib.get("line-rate", "0")
          pct_val = round(float(pct) * 100, 2)
          print(f"coverage={pct_val}")
          with open("$GITHUB_OUTPUT", "a", encoding="utf-8") as fh:
              fh.write(f"coverage={pct_val}\n")
          PY

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov/
          if-no-files-found: warn

      - name: Debug bundle
        if: always()
        run: |
          mkdir -p backend-artifacts
          (
            cd backend
            {
              echo "== git status ==" && git status -sb
              echo ""
              echo "== python ==" && python --version
            } > ../backend-artifacts/debug-info.txt
          )
        shell: bash

      - name: Upload debug bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-debug
          path: backend-artifacts
          if-no-files-found: warn

      - name: Job summary
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Backend
          - Status: ${{ job.status }}
          - Coverage: ${{ steps.coverage.outputs.coverage }}%
          - Artifacts: backend-coverage, backend-debug
          EOF
