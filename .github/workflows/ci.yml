name: Monorepo CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.set.outputs.backend }}
      frontend: ${{ steps.set.outputs.frontend }}
      docs: ${{ steps.set.outputs.docs }}
      infra: ${{ steps.set.outputs.infra }}
      site: ${{ steps.set.outputs.site }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2
        with:
          fetch-depth: 0
      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'scripts/**'
            frontend:
              - 'frontend/**'
            docs:
              - 'docs/**'
              - 'README.md'
            infra:
              - '.github/**'
              - 'Makefile'
            site:
              - 'site/**'
      - name: Normalize run flags
        id: set
        run: |
          backend=${{ steps.filter.outputs.backend }}
          frontend=${{ steps.filter.outputs.frontend }}
          docs=${{ steps.filter.outputs.docs }}
          infra=${{ steps.filter.outputs.infra }}
          site=${{ steps.filter.outputs.site }}
          if [[ "${{ github.event_name }}" == "push" ]]; then
            backend=true
            frontend=true
            docs=true
            infra=true
            site=true
          fi
          printf "backend=%s\nfrontend=%s\ndocs=%s\ninfra=%s\nsite=%s\n" "$backend" "$frontend" "$docs" "$infra" "$site" >> "$GITHUB_OUTPUT"

  actions-lint:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2
        with:
          fetch-depth: 0
      - name: Install tools
        run: ./scripts/install_tools.sh
      - name: actionlint
        run: ./.bin/actionlint

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true'
    uses: ./.github/workflows/backend.yml
    secrets: inherit

  frontend:
    needs: [changes, backend]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true'
    uses: ./.github/workflows/frontend.yml
    secrets: inherit

  frontend-e2e:
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true'
    uses: ./.github/workflows/frontend-e2e.yml
    secrets: inherit

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.infra == 'true'
    uses: ./.github/workflows/docs.yml
    secrets: inherit

  summary:
    name: Summary
    needs: [changes, actions-lint, backend, frontend, frontend-e2e, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build summary
        id: build
        run: |
          actions_status="${{ needs.actions-lint.result || 'skipped' }}"
          backend_status="${{ needs.backend.result || 'skipped' }}"
          frontend_status="${{ needs.frontend.result || 'skipped' }}"
          frontend_e2e_status="${{ needs.frontend-e2e.result || 'skipped' }}"
          docs_status="${{ needs.docs.result || 'skipped' }}"

          backend_cov="${{ needs.backend.outputs.coverage || 'n/a' }}"
          frontend_cov="${{ needs.frontend.outputs.coverage || 'n/a' }}"

          summary_file="$(mktemp)"
          cat <<EOF > "$summary_file"
          # CI Summary
          | Job | Status | Coverage | Notes |
          | --- | --- | --- | --- |
          | Actionlint | ${actions_status} | n/a | |
          | Backend | ${backend_status} | ${backend_cov}% | artifacts: backend-coverage, backend-debug |
          | Frontend | ${frontend_status} | ${frontend_cov}% | artifacts: frontend-artifacts |
          | Frontend E2E | ${frontend_e2e_status} | n/a | artifacts: frontend-e2e-artifacts-* |
          | Docs | ${docs_status} | n/a | artifacts: n/a |
          EOF
          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
      - name: PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const body = `
            ## CI Summary
            - Backend: ${{ needs.backend.result || 'skipped' }} (cov: ${{ needs.backend.outputs.coverage || 'n/a' }}%)
            - Frontend: ${{ needs.frontend.result || 'skipped' }} (cov: ${{ needs.frontend.outputs.coverage || 'n/a' }}%)
            - Docs: ${{ needs.docs.result || 'skipped' }}
            `;
            const { owner, repo, number } = context.issue;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: number });
            const marker = "[CI Summary]";
            const existing = comments.find(c => c.user?.login === "github-actions[bot]" && c.body?.includes(marker));
            const finalBody = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: finalBody });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body: finalBody });
            }

  timings:
    name: CI timings
    needs: [changes, actions-lint, backend, frontend, docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (write-enabled)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v5
        with:
          python-version: "3.11"

      - name: Collect job timings
        id: timings
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const run_id = context.runId;
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { owner, repo, run_id, per_page: 100 }
            );

            const durationMs = (start, end) => {
              if (!start || !end) return null;
              const startMs = new Date(start).getTime();
              const endMs = new Date(end).getTime();
              return Math.max(0, endMs - startMs);
            };

            const jobRecords = jobs.map((job) => ({
              id: job.id,
              name: job.name,
              started_at: job.started_at,
              completed_at: job.completed_at,
              conclusion: job.conclusion,
              duration_ms: durationMs(job.started_at, job.completed_at),
              steps: (job.steps || []).map((step) => ({
                name: step.name,
                number: step.number,
                started_at: step.started_at,
                completed_at: step.completed_at,
                status: step.status,
                conclusion: step.conclusion,
                duration_ms: durationMs(step.started_at, step.completed_at),
              })),
            }));

            const startTimes = jobRecords
              .map((j) => j.started_at)
              .filter(Boolean)
              .map((ts) => new Date(ts).getTime());
            const endTimes = jobRecords
              .map((j) => j.completed_at)
              .filter(Boolean)
              .map((ts) => new Date(ts).getTime());
            const totalMs =
              startTimes.length && endTimes.length
                ? Math.max(...endTimes) - Math.min(...startTimes)
                : null;

            const record = {
              run_id: run_id,
              run_number: context.runNumber,
              run_attempt: context.runAttempt,
              event: context.eventName,
              sha: context.sha,
              ref: context.ref,
              workflow: context.workflow,
              created_at: new Date().toISOString(),
              total_duration_ms: totalMs,
              jobs: jobRecords,
            };

            fs.mkdirSync("metrics", { recursive: true });
            fs.writeFileSync("metrics/ci_timing_latest.json", JSON.stringify(record, null, 2));

      - name: Append timing history
        run: |
          mkdir -p metrics docs
          if [ ! -f metrics/ci_timings.jsonl ]; then
            echo "# CI timing history" > metrics/ci_timings.jsonl
          fi
          cat metrics/ci_timing_latest.json >> metrics/ci_timings.jsonl
          echo "" >> metrics/ci_timings.jsonl
          rm -f metrics/ci_timing_latest.json

      - name: Render timing chart
        run: python3 backend/tasktree/ci_metrics/render.py metrics/ci_timings.jsonl docs/ci-timings.svg

      - name: Commit timing artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git status --short
          if git diff --quiet; then
            echo "No timing updates to commit."
            exit 0
          fi

          git config user.name "tasktree-ci"
          git config user.email "ci@tasktree.local"
          git add metrics/ci_timings.jsonl docs/ci-timings.svg
          git commit -m "chore: update CI timing artifacts [skip ci]"
          git push origin HEAD
