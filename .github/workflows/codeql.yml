name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ "python", "javascript" ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@901f0fdebfadabaa0664a07bd572cbd2ff90b07e # v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@901f0fdebfadabaa0664a07bd572cbd2ff90b07e # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@901f0fdebfadabaa0664a07bd572cbd2ff90b07e # v3
