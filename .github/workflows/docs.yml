name: Docs & Scripts

on:
  workflow_call:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v4

      - name: Markdownlint
        run: npx markdownlint-cli2 "README.md" "docs/**/*.md"

      - name: Install shellcheck and shfmt
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt

      - name: Shellcheck
        run: find scripts -name '*.sh' -print0 | xargs -0 shellcheck

      - name: shfmt
        run: shfmt -d scripts

      - name: Job summary
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Docs & Shell
          - Status: ${{ job.status }}
          - Checks: markdownlint, shellcheck, shfmt
          EOF
