name: Frontend Pipeline

on:
  workflow_call:
    outputs:
      coverage:
        description: Frontend coverage percentage
        value: ${{ jobs.frontend.outputs.coverage }}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.coverage }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Python (for backend service)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache uv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}

      - name: Install uv
        run: pip install uv

      - name: Sync backend deps (dev)
        working-directory: backend
        run: uv sync --extra dev

      - name: Install deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint/typecheck/format
        working-directory: frontend
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm run format:check

      - name: Unit tests
        id: unit
        working-directory: frontend
        run: pnpm run test:unit

      - name: Coverage
        id: coverage
        working-directory: frontend
        run: |
          pnpm run coverage
          python - <<'PY'
          import json
          from pathlib import Path

          summary_path = Path("coverage/coverage-summary.json")
          if not summary_path.exists():
              print("coverage-summary.json missing; defaulting coverage to 0.0")
              pct = 0.0
          else:
              data = json.loads(summary_path.read_text())
              pct = data["total"]["lines"]["pct"]

          with open("$GITHUB_OUTPUT", "a", encoding="utf-8") as fh:
              fh.write(f"coverage={pct}\n")
          PY

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (with retry)
        id: e2e
        working-directory: frontend
        env:
          CI: "true"
          PLAYWRIGHT_HTML_REPORT: playwright-report
        run: ../scripts/ci/retry.sh 2 10 pnpm exec playwright test \
          --config=playwright.config.cjs \
          --reporter=line,html \
          --output=test-results

      - name: Build
        working-directory: frontend
        run: pnpm run build

      - name: Ensure artifact contents
        if: always()
        run: |
          mkdir -p frontend/playwright-report frontend/test-results
          if [ ! -f frontend/playwright-report/index.html ]; then
            echo "HTML report not generated (likely reporter override missing)." > frontend/playwright-report/README.txt
          fi
          if [ -z "$(ls -A frontend/test-results)" ]; then
            echo "No traces or attachments were produced for this run." > frontend/test-results/README.txt
          fi

      - name: Upload frontend artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-artifacts
          path: |
            frontend/coverage/
            frontend/playwright-report/
            frontend/test-results/
            frontend/dist/
          if-no-files-found: warn

      - name: Job summary
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Frontend
          - Status: ${{ job.status }}
          - Coverage: ${{ steps.coverage.outputs.coverage }}%
          - Artifacts: frontend-artifacts
          EOF
