# Project-local tmux config for TaskTree dashboard.

set -g mouse on
set -g history-limit 20000
set -g base-index 1
set -g pane-base-index 0
setw -g automatic-rename on
setw -g aggressive-resize on
setw -g mode-keys vi
set -g status-interval 5
set -g status-keys vi
set -g focus-events on
set -as terminal-overrides ',xterm-256color:RGB'
setw -g aggressive-resize off

# Set plugin path if not provided (fallback to project-local relative to current pane).
if-shell '[ -z "#{TMUX_PLUGIN_MANAGER_PATH}" ]' 'set-environment -g TMUX_PLUGIN_MANAGER_PATH "#{pane_current_path}/.tmux/plugins"'

# Theme: muted charcoal + teal accents, powerline-style.
set -g status-bg colour236
set -g status-fg colour252
set -g status-left-length 60
set -g status-right-length 120
set -g status-left "#[bg=colour240,fg=colour45,bold] power #[bg=colour236,fg=colour252] #S #{?client_prefix,#[fg=colour203]⌨ ,} "
set -g status-right "#[fg=colour245]catppuccin #[fg=colour240]| #[fg=colour252]%Y-%m-%d %H:%M "

set -g window-status-format " #[fg=colour244]#I #[fg=colour250]#W "
set -g window-status-current-format "#[bg=colour24,fg=colour231,bold] #I #[fg=colour231]#W "

set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour45"
set -g pane-border-format " #[fg=colour244]#P #[fg=colour45]#{pane_title} #[fg=colour240]#{pane_current_command} "

set -g message-style "bg=colour238,fg=colour255"

# Toggle mouse (capture scroll to avoid escape noise in panes).
bind-key m if -F "#{mouse}" "set -g mouse off; display 'mouse: off'" "set -g mouse on; display 'mouse: on'"
# Toast test (manual trigger to verify display-message).
bind-key T display-message "tmux toast test (Prefix+T)"
# Refresh dashboard panes (quiet, background).
bind-key R run-shell -b 'PR="#{?@PROJECT_ROOT,#{@PROJECT_ROOT},#{pane_current_path}}"; [ -z "$PR" ] && PR="$PWD"; "$PR/scripts/refresh_tmux_dashboard.sh" --session "#{session_name}" >/tmp/ttx-refresh.log 2>&1 && tmux display-message "dashboard refreshed" || tmux display-message "refresh failed (see /tmp/ttx-refresh.log)"'
# Fuzzy jump (requires fzf).
bind-key f run-shell "tmux-fzf"
# Capture pane to share history + clipboard.
bind-key C run-shell -b 'PR="#{?@PROJECT_ROOT,#{@PROJECT_ROOT},#{pane_current_path}}"; [ -z "$PR" ] && PR="$PWD"; "$PR/scripts/share_pane.sh" "#{session_name}" "#{window_name}" "#{pane_index}" "#{pane_title}" "#{pane_current_command}" "#{pane_pid}" "#{pane_current_path}" >/tmp/tmux-share.log 2>&1; msg=$(tail -n1 /tmp/tmux-share.log 2>/dev/null); tmux display-message "${msg:-pane captured}"'
# Alt copy shortcut (same as C; easier mnemonic for "yank").
bind-key y run-shell -b 'PR="#{?@PROJECT_ROOT,#{@PROJECT_ROOT},#{pane_current_path}}"; [ -z "$PR" ] && PR="$PWD"; "$PR/scripts/share_pane.sh" "#{session_name}" "#{window_name}" "#{pane_index}" "#{pane_title}" "#{pane_current_command}" "#{pane_pid}" "#{pane_current_path}" >/tmp/tmux-share.log 2>/dev/null; msg=$(tail -n1 /tmp/tmux-share.log 2>/dev/null); tmux display-message "${msg:-pane captured}"'
# Mouse double-click to copy pane + toast.
bind-key -n DoubleClick1Pane run-shell -b 'PR="#{?@PROJECT_ROOT,#{@PROJECT_ROOT},#{pane_current_path}}"; [ -z "$PR" ] && PR="$PWD"; "$PR/scripts/share_pane.sh" "#{session_name}" "#{window_name}" "#{pane_index}" "#{pane_title}" "#{pane_current_command}" "#{pane_pid}" "#{pane_current_path}" >/tmp/tmux-share.log 2>&1; msg=$(tail -n1 /tmp/tmux-share.log 2>/dev/null); tmux display-message "${msg:-pane copied (mouse)}"'
# Health check (watchdog on demand).
bind-key H run-shell -b 'PR="#{?@PROJECT_ROOT,#{@PROJECT_ROOT},#{pane_current_path}}"; [ -z "$PR" ] && PR="$PWD"; "$PR/scripts/health_check.sh" "#{session_name}"'

# Plugins (TPM + persist).
set -g @plugin 'tmux-plugins/tpm'
set -ga @plugin ' tmux-plugins/tmux-resurrect'
set -ga @plugin ' tmux-plugins/tmux-continuum'
set -ga @plugin ' tmux-plugins/tmux-prefix-highlight'
set -ga @plugin ' wfxr/tmux-power'
set -ga @plugin ' sainnhe/tmux-fzf'
set -ga @plugin ' catppuccin/tmux'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_user 'ttx'
set -g @catppuccin_window_status_enable 'yes'
set -g @catppuccin_icon_pack 'none'

# TPM bootstrap; skip quietly if not installed.
if-shell '[ -x "#{TMUX_PLUGIN_MANAGER_PATH}/tpm/tpm" ]' 'run-shell "#{TMUX_PLUGIN_MANAGER_PATH}/tpm/tpm"' 'display-message "TPM not found at #{TMUX_PLUGIN_MANAGER_PATH}/tpm/tpm (skipping)"'
