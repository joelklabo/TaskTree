[project]
name = "tasktree"
version = "0.1.0"
description = "TaskTree - simple, traceable task DAGs for agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.135.3",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "pyyaml>=6.0",
  "jinja2>=3.1.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=4.0.0",
  "mypy>=1.10.0",
  "ruff>=0.5.0",
  "types-PyYAML",
  "types-Jinja2",
  "bandit",
  "yamllint",
  "djlint",
]

[project.scripts]
tt = "tasktree.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Deptry: map package names to import names and ignore expected-but-indirect deps.
[tool.deptry]
package_module_name_map = { "pyyaml" = ["yaml"] }

[tool.deptry.per_rule_ignores]
DEP002 = [
  "uvicorn",         # invoked via CLI entrypoint, not imported
  "alembic",         # migration CLI
  "pyyaml",          # imported as `yaml`
  "python-dotenv",   # env loader for dev
  "pytest",
  "pytest-cov",
  "mypy",
  "ruff",
  "types-PyYAML",
  "types-Jinja2",
  "bandit",
  "yamllint",
  "djlint",
]
