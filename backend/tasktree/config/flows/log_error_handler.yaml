id: log_error_handler
name: "Log Error Handler"
version: "0.3.0"
description: "Autonomous error handler with retry: investigate → implement → test → retry or triage"
start: investigate
steps:
  - id: investigate
    agent: codex_cli
    action: investigate_error
    resources: []
    transitions:
      success: implement
      failure: triage

  - id: implement
    agent: codex_cli
    action: implement_fix
    resources:
      - "backend/**"
      - "frontend/**"
    transitions:
      success: test
      failure: triage

  - id: test
    agent: codex_cli
    action: run_tests
    resources:
      - "backend/tests/**"
      - "frontend/tests/**"
    transitions:
      tests_passed: end
      tests_failed: retry_or_triage

  - id: retry_or_triage
    agent: codex_cli
    action: check_retry_count
    resources: []
    transitions:
      should_retry: investigate
      should_triage: triage

  - id: triage
    agent: codex_cli
    action: triage_failure
    resources: []
    transitions:
      success: end
      failure: end
