id: code_fix
name: "Code Fix"
version: "0.1.0"
description: "Fix a bug, run tests, and handle failures."
start: plan
steps:
  - id: plan
    agent: codex_cli
    action: plan_bugfix
    resources: []
    transitions:
      success: implement
      failure: end

  - id: implement
    agent: codex_cli
    action: implement_fix
    resources:
      - "src/**"
    transitions:
      success: test
      failure: end

  - id: test
    agent: codex_cli
    action: run_tests
    resources:
      - "tests/**"
    transitions:
      tests_passed: end
      tests_failed: implement
