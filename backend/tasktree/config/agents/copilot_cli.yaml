id: copilot_cli
name: "Copilot CLI Agent"
description: "Uses an LLM to generate commands and optionally execute them."
model: "gpt-4.1-mini"
temperature: 0.2
max_tokens: 256
llm_enabled: false
llm_endpoint: ""
api_key_env: "OPENAI_API_KEY"
llm_timeout_sec: 30
backend_type: "api"
backend_cmd: []
tools:
  - type: "shell"
    allow_write: true
    root: "."
# For strict dry-run, leave execute_commands false (default).
execute_commands: false
command_allowlist: []
command_denylist: []
command_timeout_sec:
command_dry_run: false
block_destructive: true
# Optional test mocks per action (JSON strings).
mock_responses: {}
